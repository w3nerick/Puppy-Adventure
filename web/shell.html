<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Game - Aventura Gatuna</title>
    <meta name="description" content="Juego de plataformas estilo Mario Bros con un gatito como protagonista.">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            height: 100%;
            background: linear-gradient(180deg, #87CEEB 0%, #C8E6FA 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #2c3e50;
            overflow: hidden;
        }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        h1 {
            color: #FF8C00;
            font-size: 28px;
            margin-bottom: 6px;
            text-shadow: 2px 2px 0 rgba(255, 255, 255, 0.7);
        }
        h1 .paw { font-size: 24px; }
        .subtitle {
            color: #555;
            font-size: 14px;
            margin-bottom: 14px;
        }
        #game-wrap {
            position: relative;
            background: #000;
            border-radius: 10px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            max-width: 100%;
        }
        #canvas {
            display: block;
            outline: none;
            max-width: 100%;
            height: auto;
            background: #87CEEB;
            image-rendering: pixelated;
        }
        #loading {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #1a1a1a;
            color: #fff;
            text-align: center;
            transition: opacity 0.4s ease;
            z-index: 5;
        }
        #loading.hide { opacity: 0; pointer-events: none; }
        .cat-loader {
            font-size: 56px;
            animation: bounce 0.8s ease-in-out infinite;
            margin-bottom: 16px;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }
        #progress-bar {
            width: 240px;
            height: 8px;
            background: #333;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 12px;
        }
        #progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #FF8C00, #FFD700);
            transition: width 0.2s ease;
        }
        #status-text {
            font-size: 13px;
            color: #aaa;
            margin-top: 8px;
        }
        .controls {
            margin-top: 14px;
            font-size: 13px;
            color: #444;
            background: rgba(255, 255, 255, 0.7);
            padding: 8px 16px;
            border-radius: 20px;
            backdrop-filter: blur(8px);
        }
        .controls kbd {
            background: #fff;
            border: 1px solid #bbb;
            border-bottom-width: 2px;
            border-radius: 4px;
            padding: 2px 6px;
            font-family: monospace;
            font-size: 12px;
            margin: 0 2px;
        }
        .footer {
            margin-top: 10px;
            font-size: 11px;
            color: #666;
        }
        .footer a { color: #FF8C00; text-decoration: none; }
        .footer a:hover { text-decoration: underline; }
        @media (max-width: 700px) {
            h1 { font-size: 22px; }
            .controls { font-size: 11px; padding: 6px 10px; }
        }
    </style>
</head>
<body>
    <h1><span class="paw">&#128062;</span> Cat Game <span class="paw">&#128062;</span></h1>
    <div class="subtitle">Aventura Gatuna - Plataformas estilo Mario Bros</div>

    <div id="game-wrap">
        <canvas id="canvas" width="960" height="540" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
        <div id="loading">
            <div class="cat-loader">&#128049;</div>
            <div>Cargando el gatito...</div>
            <div id="progress-bar"><div id="progress-fill"></div></div>
            <div id="status-text">Inicializando WebAssembly...</div>
        </div>
    </div>

    <div class="controls">
        <kbd>&larr;</kbd><kbd>&rarr;</kbd> mover &nbsp;|&nbsp;
        <kbd>Espacio</kbd> / <kbd>&uarr;</kbd> saltar &nbsp;|&nbsp;
        <kbd>Enter</kbd> empezar
    </div>
    <div class="footer">Hecho con C++ + raylib + WebAssembly</div>

    <script>
        const canvas = document.getElementById('canvas');
        const loading = document.getElementById('loading');
        const fill = document.getElementById('progress-fill');
        const status = document.getElementById('status-text');

        // Asegurar foco en el canvas para que reciba teclado
        canvas.addEventListener('click', () => canvas.focus());
        window.addEventListener('load', () => canvas.focus());

        // Bloquear scroll cuando se usan flechas/espacio en el canvas
        window.addEventListener('keydown', (e) => {
            if ([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
                if (document.activeElement === canvas || e.target === document.body) {
                    e.preventDefault();
                }
            }
        }, { passive: false });

        var Module = {
            canvas: canvas,
            print: (text) => console.log('[wasm]', text),
            printErr: (text) => console.warn('[wasm-err]', text),
            setStatus: (text) => {
                if (!text) {
                    fill.style.width = '100%';
                    setTimeout(() => loading.classList.add('hide'), 200);
                    setTimeout(() => loading.style.display = 'none', 600);
                    return;
                }
                status.textContent = text;
                const m = text.match(/(\d+)\s*\/\s*(\d+)/);
                if (m) {
                    const pct = (parseInt(m[1]) / parseInt(m[2])) * 100;
                    fill.style.width = pct + '%';
                } else {
                    fill.style.width = '50%';
                }
            },
            totalDependencies: 0,
            monitorRunDependencies: function(left) {
                this.totalDependencies = Math.max(this.totalDependencies, left);
                Module.setStatus(left ? 'Preparando... ' + (this.totalDependencies - left) + '/' + this.totalDependencies : '');
            }
        };
        Module.setStatus('Descargando...');
        window.onerror = (e) => {
            console.error(e);
            Module.setStatus('Error al cargar el juego. Mira la consola para mas detalles.');
        };
    </script>

    {{{ SCRIPT }}}
</body>
</html>
